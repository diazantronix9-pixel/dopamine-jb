name: Build Dopamine IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build for iOS device (no signing)
        run: |
          xcodebuild \
            -project Dopamine.xcodeproj \
            -scheme Dopamine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir dist
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          cd build/Build/Products/Release-iphoneos
          zip -r ../../../../dist/Dopamine.ipa "$(basename $APP_PATH)"
          ls -lh dist/Dopamine.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-ios26-ipa
          path: dist/Dopamine.ipa